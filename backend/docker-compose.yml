services:
  backend:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on: [postgres, redis, minio]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: elma
      POSTGRES_USER: elma
      POSTGRES_PASSWORD: elma_password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
